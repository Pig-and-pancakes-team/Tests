<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P-and-P Editor | Serverless Matrix Link</title>
    <style>
        :root {
            --bg: #0b0e14; --panel: #161c24; --blue: #00e5ff; --pink: #ff2a74;
            --text: #f0f4f8; --muted: #6272a4; --green: #50fa7b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: monospace; padding: 20px; font-size: 18px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { color: var(--blue); text-transform: uppercase; text-align: center; margin-bottom: 25px; font-size: 2.3rem; border-bottom: 4px double var(--blue); padding-bottom: 10px; }
        section { background: var(--panel); border: 2px solid #232e3b; padding: 20px; margin-bottom: 25px; }
        .pix { text-transform: uppercase; color: var(--pink); font-weight: bold; margin-bottom: 15px; display: block; }
        .hub-form { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; background: #0d1117; padding: 20px; border: 1px dashed var(--pink); }
        .f-group { display: flex; flex-direction: column; gap: 5px; }
        .f-full { grid-column: 1 / -1; }
        label { color: var(--blue); font-size: 0.85rem; text-transform: uppercase; font-weight: bold; }
        input, textarea { background: #000; border: 1px solid #2d3b4e; color: #fff; padding: 10px; font-family: inherit; font-size: 16px; }
        .btn { display: inline-block; width: 100%; padding: 10px; background: transparent; border: 2px solid var(--blue); color: var(--blue); font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 15px; font-family: inherit; text-align: center; text-decoration: none; }
        .btn:hover { background: var(--blue); color: var(--bg); box-shadow: 0 0 10px var(--blue); }
        .media-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; margin-top: 15px; }
        .m-box { background: #11161d; border: 2px dashed #2d3b4e; padding: 15px; position: relative; text-align: left; }
    </style>
</head>
<body>

<div class="container">
    <h1>🛰 P&P Serverless Matrix Link</h1>

    <!-- БЛОК 1: ГЕНЕРАЦИЯ ССЫЛКИ -->
    <section>
        <span class="pix">📦 Step 1: Pack Cartridge Into URL</span>
        <form id="linkForm" class="hub-form">
            <div class="f-group">
                <label>Game Title</label>
                <input type="text" id="cTitle" required placeholder="e.g., Error Knight">
            </div>
            <div class="f-group">
                <label>Creator Nickname</label>
                <input type="text" id="cAuthor" required placeholder="e.g., Vasya322">
            </div>
            <div class="f-group f-full">
                <label>Short Description</label>
                <textarea id="cDesc" rows="2" required placeholder="Describe your standalone build..."></textarea>
            </div>
            <div class="f-group f-full">
                <label>Select .SAV File</label>
                <input type="file" id="cFile" accept=".sav" required>
            </div>
            <button type="submit" class="btn" style="border-color: var(--pink); color: var(--pink);">⚡ Generate Shareable Link</button>
        </form>
        
        <!-- Поле с готовой сгенерированной ссылкой -->
        <div id="urlWrapper" style="display: none; margin-top: 20px; border-top: 1px dashed #2d3b4e; padding-top: 15px;">
            <label style="color: var(--green);">✔️ Shareable URL generated successfully:</label>
            <input type="text" id="generatedUrl" readonly style="color: var(--green); border-color: var(--green);">
            <p style="font-size: 0.8rem; color: var(--muted); margin-top: 5px;">📋 Copy this URL and send it to other players. It contains your entire game!</p>
        </div>
    </section>

    <!-- БЛОК 2: ПОЛКА ПОЛУЧЕНИЯ ИЗ ССЫЛКИ -->
    <section>
        <span class="pix" style="color: var(--green);">📡 Step 2: Incoming Shared Cartridge</span>
        <div id="incomingGrid" class="media-grid">
            <p style="color: var(--muted); font-style: italic;">No shared cartridge loaded. Open the site via a shared link to see it.</p>
        </div>
    </section>
</div>

<script>
    const linkForm = document.getElementById('linkForm');
    const urlWrapper = document.getElementById('urlWrapper');
    const generatedUrl = document.getElementById('generatedUrl');
    const incomingGrid = document.getElementById('incomingGrid');

    document.addEventListener('DOMContentLoaded', () => {
        // Намертво фиксируем никнейм автора на ПК, он не сотрется при F5
        if (localStorage.getItem('pndp_saved_nick')) {
            document.getElementById('cAuthor').value = localStorage.getItem('pndp_permanent_nick') || localStorage.getItem('pndp_saved_nick');
        }
        
        // Автоматически проверяем адресную строку на наличие переданной игры
        parseIncomingUrlLink();
    });

    // 1. УПАКОВКА ИГРЫ В ДЛИННУЮ ТЕКСТОВУЮ ССЫЛКУ
    if (linkForm) {
        linkForm.addEventListener('submit', function(e) {
            e.preventDefault();

            // Безопасно вытаскиваем элементы напрямую через форму e.target
            const title = document.getElementById('cTitle').value;
            const author = document.getElementById('cAuthor').value;
            const desc = document.getElementById('cDesc').value;
            
            // Прямой защищенный захват списка файлов без сбоев ID
            const fileElement = document.getElementById('cFile');
            if (!fileElement || !fileElement.files || fileElement.files.length === 0) {
                alert("Please select a valid .sav file first!");
                return;
            }
            
            const targetFile = fileElement.files[0]; // Строго берем сам файл

            localStorage.setItem('pndp_saved_nick', author);

            const reader = new FileReader();
            reader.onload = function(event) {
                const savText = event.target.result;

                // Создаем легкий сжатый объект данных
                const payload = {
                    t: title,
                    a: author,
                    d: desc,
                    s: btoa(unescape(encodeURIComponent(savText))), // Сжимаем спецсимволы в безопасный Base64
                    n: targetFile.name
                };

                // Переводим объект в зашифрованную строку для URL
                const encryptedPayload = encodeURIComponent(JSON.stringify(payload));
                
                // Склеиваем текущий адрес сайта с хэш-данными игры
                const cleanBaseUrl = window.location.href.split('#')[0];
                const finalLink = cleanBaseUrl + "#cart=" + encryptedPayload;

                // Выводим готовую ссылку на экран
                generatedUrl.value = finalLink;
                urlWrapper.style.display = 'block';
                generatedUrl.select();
            };
            
            // Запуск чтения строго проверенного файла-блоба
            reader.readAsText(targetFile);
        });
    }

    // 2. ЧТЕНИЕ И СКАЧИВАНИЕ ИЗ АДРЕСНОЙ СТРОКИ ДРУГОГО ПК
    function parseIncomingUrlLink() {
        if (!incomingGrid) return;
        
        const hash = window.location.hash;
        if (!hash || hash.indexOf("#cart=") !== 0) return;

        try {
            // Извлекаем зашифрованную посылку из адреса
            const encryptedData = hash.substring(6);
            const decryptedText = decodeURIComponent(encryptedData);
            const cart = JSON.parse(decryptedText);

            if (!cart.s || !cart.t) return;

            // Рисуем карточку полученной игры
            incomingGrid.innerHTML = '';
            const card = document.createElement('div');
            card.className = 'm-box';
            card.innerHTML = '<h3 style="color: var(--blue); margin-bottom: 5px;">' + cart.t + '</h3>' +
                             '<p style="font-size: 0.8rem; color: var(--pink); margin-bottom: 8px;">By ' + cart.a + '</p>' +
                             '<p style="font-size: 0.85rem; color: var(--text); margin-bottom: 15px; min-height: 40px;">' + cart.d + '</p>' +
                             '<button class="btn" style="margin-top:0; font-size:0.85rem;" onclick="downloadUrlSav(\'' + cart.s + '\', \'' + encodeURIComponent(cart.n) + '\')">⚡ Install .SAV</button>';
            
            incomingGrid.appendChild(card);
        } catch (err) {
            incomingGrid.innerHTML = '<p style="color: var(--red);">❌ Failed to extract cartridge from URL anchor.</p>';
        }
    }

    // 3. АВТОРАСПАКОВКА И СКАЧИВАНИЕ .SAV ФАЙЛА НА ЖЕСТКИЙ ДИСК
    function downloadUrlSav(base64Content, encodedName) {
        try {
            const fileName = decodeURIComponent(encodedName);
            const rawSavText = decodeURIComponent(escape(atob(base64Content)));
            
            const blob = new Blob([rawSavText], { type: "text/plain" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = fileName || "cartridge.sav";
            link.click();
        } catch (e) {
            alert("Data extraction crashed.");
        }
    }
</script>

</body>
</html>
